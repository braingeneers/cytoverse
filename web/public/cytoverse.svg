<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Cell gradients -->
    <radialGradient id="blueCell" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a1f4ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </radialGradient>
    <radialGradient id="purpleCell" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4a1ff"/>
      <stop offset="100%" stop-color="#7700ff"/>
    </radialGradient>
    <radialGradient id="greenCell" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a1ffc9"/>
      <stop offset="100%" stop-color="#00cc77"/>
    </radialGradient>

    <!-- Tail gradients -->
    <linearGradient id="blueTail" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a1f4ff00"/>
      <stop offset="100%" stop-color="#a1f4ffaa"/>
    </linearGradient>
    <linearGradient id="purpleTail" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f4a1ff00"/>
      <stop offset="100%" stop-color="#f4a1ffaa"/>
    </linearGradient>
    <linearGradient id="greenTail" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a1ffc900"/>
      <stop offset="100%" stop-color="#a1ffc9aa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#000015"/>

  <!-- Starfield -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Random stars -->
    <circle cx="4" cy="8" r="0.5"/><circle cx="8" cy="16" r="0.4"/><circle cx="12" cy="4" r="0.3"/>
    <circle cx="6" cy="24" r="0.6"/><circle cx="14" cy="20" r="0.4"/><circle cx="10" cy="32" r="0.5"/>
    <circle cx="2" cy="40" r="0.4"/><circle cx="18" cy="12" r="0.3"/><circle cx="24" cy="6" r="0.5"/>
    <circle cx="20" cy="26" r="0.4"/><circle cx="28" cy="18" r="0.6"/><circle cx="26" cy="34" r="0.3"/>
    <circle cx="30" cy="10" r="0.5"/><circle cx="34" cy="22" r="0.4"/><circle cx="36" cy="4" r="0.3"/>
    <circle cx="40" cy="14" r="0.5"/><circle cx="44" cy="6" r="0.3"/><circle cx="42" cy="24" r="0.6"/>
    <circle cx="46" cy="18" r="0.4"/><circle cx="48" cy="30" r="0.3"/><circle cx="52" cy="8" r="0.5"/>
    <circle cx="54" cy="20" r="0.4"/><circle cx="56" cy="4" r="0.3"/><circle cx="58" cy="16" r="0.5"/>
    <circle cx="60" cy="12" r="0.4"/><circle cx="62" cy="6" r="0.3"/><circle cx="6" cy="50" r="0.3"/>
    <circle cx="12" cy="56" r="0.4"/><circle cx="20" cy="60" r="0.3"/><circle cx="16" cy="44" r="0.4"/>
    <circle cx="26" cy="48" r="0.3"/><circle cx="28" cy="58" r="0.4"/><circle cx="34" cy="52" r="0.3"/>
    <circle cx="38" cy="60" r="0.4"/><circle cx="44" cy="48" r="0.3"/><circle cx="50" cy="56" r="0.4"/>
    <circle cx="52" cy="40" r="0.3"/><circle cx="60" cy="50" r="0.4"/><circle cx="62" cy="60" r="0.3"/>
  </g>

  <!-- Comet tails -->
  <path d="M10,50 C20,38 34,30 40,28" stroke="url(#blueTail)" stroke-width="5" stroke-linecap="round"/>
  <path d="M6,58 C18,46 34,38 42,42" stroke="url(#purpleTail)" stroke-width="4" stroke-linecap="round"/>
  <path d="M12,34 C24,24 36,16 40,14" stroke="url(#greenTail)" stroke-width="4" stroke-linecap="round"/>

  <!-- Separated cell heads -->
  <circle cx="40" cy="28" r="9" fill="url(#blueCell)"/>
  <circle cx="42" cy="42" r="8" fill="url(#purpleCell)"/>
  <circle cx="40" cy="14" r="7" fill="url(#greenCell)"/>
</svg>
