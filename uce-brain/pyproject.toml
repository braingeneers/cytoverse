[project]
name = "uce-brain"
version = "0.1.0"
description = "UCE-brain export, embedding, and validation tooling for cytoverse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1.0",
    "onnx>=1.19.0",
    "onnxruntime>=1.24.4",
    "onnxscript>=0.6.0",
    "pandas>=2.2.2",
    "pyarrow>=14.0.0",
    "safetensors>=0.4.0",
    "scanpy>=1.10.2",
    "scipy>=1.14.1",
    "torch>=2.11.0",
    "tqdm>=4.66.5",
    "transformers>=4.40.0",
    "typer>=0.9.0",
]

[tool.uv]
# No installable package — just manage dependencies for the scripts.
package = false
