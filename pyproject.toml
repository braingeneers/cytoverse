# [build-system]
# requires = ["hatchling", "setuptools>=61.0", "wheel0"]
# build-backend = "setuptools.build_meta"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[project]
name = "cytoverse"
version = "0.1.0"
requires-python = ">=3.12, <3.13"
dependencies = [
    "typer>=0.16.0",
    "anndata>=0.12.1",
    "scimilarity",
    "umap-pytorch",
    "anndata>=0.12.1",
    "pyarrow>=21.0.0",
    "scanpy>=1.11.4",
    "numpy>=1.24,<2.3",
    "scipy>=1.16.1",
    "scikit-learn>=1.7.1",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "onnx>=1.18.0",
    "onnxruntime>=1.22.1",
    "onnxscript>=0.3.2",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "cairosvg>=2.8.2",
    "debugpy>=1.8.15",
    "flake8>=7.2.0",
    "graphviz>=0.21",
    "ipython>=8.37.0",
    "jupyter>=1.1.1",
    "jupyter-console>=6.6.3",
    "netron>=8.3.9",
    "pytest>=8.0.0",
]

[tool.uv.sources]
scimilarity = { git = "https://github.com/Genentech/scimilarity.git" }
umap-pytorch = { git = "https://github.com/rcurrie/umap_pytorch.git" }

[tool.uv]
override-dependencies = ["umap-learn>=0.5.0", "numba>=0.60.0"]
