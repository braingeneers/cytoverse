[project]
name = "cellspace"
version = "0.1.0"
description = "Search, display and label cells in foundation model embedding space"
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
    "onnx>=1.18.0",
    "onnxruntime>=1.15.0",
    "scimilarity",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.2.0",
    "ipython>=8.37.0",
    "jupyter>=1.1.1",
    "jupyter-console>=6.6.3",
    "netron>=8.3.9",
]

[tool.uv.sources]
scimilarity = { path = "../scimilarity" }
